# Lint, types, tests, contracts and the web build on every push and pull request.
# The end-to-end hello world needs Ollama and a GPU, so it runs on the hub Mac
# (`npm run e2e:hello`) and its output is kept in docs/architecture/evidence/.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Secret scan (SRS-SEC-2)
        run: npm run secret-scan
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run contracts
      - run: npm run build
      - name: Link page JavaScript budget (SRS-PERF-2)
        run: npm run budget
