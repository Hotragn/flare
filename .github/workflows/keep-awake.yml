name: Keep the live app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health
        run: curl -fsS -m 90 https://flare-outside.onrender.com/api/v1/health > /dev/null || true
